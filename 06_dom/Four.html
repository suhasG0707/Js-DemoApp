<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUHAS G CHANEL</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addlanguage(langName) {// this code traval full tree
        
      const li=  document.createElement('li');
      li.innerHTML=`${langName}`
      document.querySelector('.language').appendChild(li)


    }
    addlanguage("C#")
     addlanguage("JAVASCRIPT")


     function addoptilangauge(LanagName) { // this optomise code
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(LanagName))  
        document.querySelector('.language').appendChild(li)   
     }
     addoptilangauge('dot net')
     addoptilangauge('Python')
     //edit
    const secondlang= document.querySelector('li:nth-child(2)')
 const newli=   document.createElement('li')
 newli.textContent='oracle'
 secondlang.replaceWith(newli)
    //edit
    const firstlang=document.querySelector('li:first-child')
    firstlang.outerHTML='<li>typescrpt</li>'
    // remove
 const lastlang=  document.querySelector('li:last-child')
 lastlang.remove()
</script>
</html>
